<body>
<div id="stage">
  <div id="bg"></div>
  <div id="captions"></div>
  <div id="phoneWrap"><div class="phone" id="phone"><div class="phoneInner" id="phoneInner"><div class="screenBox" id="screen"></div><div class="island"></div></div></div></div>

<script>
const PHONE_SCALE = 1.68;
const FONT = 'Manrope';
let D = null;
let SCENES = [];
let BY = {};
let TAPS = [];
let GLOWS = [];
let EV = {};
let NOW = 0;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const range = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const backOut = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const fmtInt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const fmtDec = x => String(x).replace('.', ',');
const priceLabel = s => (s.price_note === 'approx' ? '≈ ' : '') + fmtInt(s.price_byn) + ' BYN';
const nameOf = s => `${s.brand} ${s.model}`;
const TYPE_LABELS = {modular_2in1: 'Модульная 2 в 1', modular_3in1: 'Модульная 3 в 1', stroll: 'Прогулочная', travel: 'Для путешествий', cane: 'Трость', twin: 'Для двойни', jogger: 'Спортивная'};
const CHIP_TYPES = ['modular_2in1', 'modular_3in1', 'stroll', 'travel', 'cane', 'jogger', 'twin'];
const meta = s => [s.weight_kg != null ? `${fmtDec(s.weight_kg)} кг` : null, s.age_from_months === 0 ? 'с рождения' : `с ${s.age_from_months} мес`].filter(Boolean).join(' · ');
const NAMED_COLORS = {'black': '#2E3230', 'deep black': '#262A29', 'dusty pink': '#D9A6A0', 'stormy blue': '#5E7C96', 'grey': '#8D9491', 'soho grey': '#7D8582', 'mirage grey': '#A3AAA7', 'mocha': '#8C6E5A', 'sand': '#CDB894', 'green': '#5E7F5F', 'navy': '#2F4560', 'beige': '#D8C6A8', 'taupe': '#9A8B7C'};
const PALETTE = ['#4E6B63', '#8C6E5A', '#5E7C96', '#B4836B', '#6F7D5C', '#7A6A8C'];
function colorHex(name, i = 0) {
  const key = String(name || '').toLowerCase();
  const hit = Object.keys(NAMED_COLORS).find(k => key.includes(k));
  return hit ? NAMED_COLORS[hit] : PALETTE[i % PALETTE.length];
}
function mix(hex, other, p) {

    <div class="aInput"><div class="aField${input ? '' : ' ph'}">${input ? input + (showCaret ? '<span class="caret"></span>' : '') : 'Напишите, что ищете…'}</div><div class="aSend${pressed('assistant-send')}" data-tap="assistant-send">${ICONS.send('#fff')}</div></div>`;
  return appShell(body, 'assistant', lt >= e.added ? 2 : 1);
}
function cartScreen(lt) {
  const e = EV.cart;
  const fly = D.byId['bugaboo-butterfly-2'];
  const thule = D.byId['thule-urban-glide-3'];
  const goods = fly.price_byn + thule.price_byn;
  const method = lt >= e.courier ? 'courier_brest' : 'pickup';
  const delivery = D.shop.delivery.find(d => d.method === method);
  const shipping = delivery.free_from_byn && goods >= delivery.free_from_byn ? 0 : delivery.price_byn;
  const options = D.shop.delivery.map(d => {
    const free = d.price_byn === 0 || (d.free_from_byn && goods >= d.free_from_byn);
    return `<div class="opt${pressed('delivery-' + d.method)}" data-tap="delivery-${d.method}"><div class="radio${d.method === method ? ' on' : ''}"><i></i></div><div><b>${d.title}</b><small>${d.eta}</small></div><div class="p">${free ? 'бесплатно' : fmtInt(d.price_byn) + ' BYN'}</div></div>`;
  }).join('');
  const line = (s, color, isAi) => `<div class="cLine"><div class="im">${pram(strollerColor(s, color), 76)}</div><div style="flex:1"><div class="md">${nameOf(s)}</div><div class="sub">${color}</div>${isAi ? '<span class="aiTag">добавил помощник</span>' : ''}<div class="row"><div class="pr">${priceLabel(s)}</div><div class="step">−<span>1</span>+</div></div></div></div>`;
  const toastP = easeOut(range(lt, e.done, e.done + .4));
  const body = `<div class="hdr" style="padding-bottom:4px"><div><div class="h1">Корзина</div><div class="cap1">2 товара</div></div></div>
    ${line(fly, fly.colors[fly.colors.length - 1], false)}
    ${line(thule, thule.colors[0], true)}
    <div class="box"><h4>Получение</h4>${options}</div>
    <div class="box"><div class="sumRow"><span>Товары</span><span>${fmtInt(goods)} BYN</span></div><div class="sumRow"><span>Доставка</span><span>${shipping ? fmtInt(shipping) + ' BYN' : 'бесплатно'}</span></div><div class="sumRow total" style="${glow('cart-total')}border-radius:8px"><span>Итого</span><span>≈ ${fmtInt(goods + shipping)} BYN</span></div></div>`;
  const checkout = `<div style="position:absolute;left:0;right:0;bottom:84px;padding:10px 16px;background:var(--bg);z-index:20"><div class="btn${pressed('checkout')}" data-tap="checkout">Оформить заказ</div></div>`;
  const toast = lt >= e.done ? `<div class="toast" style="opacity:${toastP};transform:translateY(${(1 - toastP) * 30}px);bottom:160px">${ICONS.check('#9fd3c4', 20)}Заказ оформлен</div>` : '';
  return appShell(body, 'cart', 2, checkout + toast);
}

function screenFor(id, t) {
  const sc = BY[id];
  const lt = t - sc.start;
  if (id === 'botStart' || id === 'botPick' || id === 'botCart') return tgScreen(t - BY.botStart.start);
  if (id === 'appCatalog') return catalogScreen(lt);
  if (id === 'appDetails') return detailsScreen(lt);
  if (id === 'appAssistant') return assistantScreen(lt);
  if (id === 'appCart') return cartScreen(lt);
  if (id === 'outro') return cartScreen(t - BY.appCart.start);
  return tgScreen(0);
}
const TRANSITIONS = {botStart: ['rise', 1.1], botPick: ['none', 0], botCart: ['none', 0], appCatalog: ['flip', 1.0], appDetails: ['push', .5], appAssistant: ['fade', .45], appCart: ['push', .5], outro: ['sink', 1.0]};
const TAGS = {botStart: 'telegram', botPick: 'telegram', botCart: 'telegram', appCatalog: 'app', appDetails: 'app', appAssistant: 'app', appCart: 'app'};

function setup(data) {
  D = data;
  D.byId = Object.fromEntries(D.strollers.map(s => [s.id, s]));
  let t = 0;
  SCENES = D.scenes.map(s => { const sc = {...s, start: t}; t += s.duration; return sc; });
  BY = Object.fromEntries(SCENES.map(s => [s.id, s]));
  const rel = (id, x) => BY[id].start - BY.botStart.start + x;
  const pick = BY.botPick.duration;
  EV.tg = {
    start: .9, greet: 1.6, kbShow: 2.6,
    kbHide: rel('botPick', .05), ask: rel('botPick', .1), typing1: rel('botPick', .55), answer: rel('botPick', 2.0),
    card1: rel('botPick', 3.2), card2: rel('botPick', Math.min(4.6, pick - 1.2)),
    typing2: rel('botCart', 1.0), added: rel('botCart', 2.1), cartTypeA: rel('botCart', 3.0), cartTypeB: rel('botCart', 3.4), cartSend: rel('botCart', 3.6), cartAsk: rel('botCart', 3.65), typing3: rel('botCart', 3.9), cartMsg: rel('botCart', 4.5),
  };
  const absTg = x => BY.botStart.start + x;
  const cat = BY.appCatalog.duration;
  EV.catalog = {scrollA: 1.2, scrollB: 2.5, backA: 2.8, backB: 3.6, chipsA: 3.7, chipsB: 4.3, filter: 4.75, tap: cat - .55};
  const det = BY.appDetails.duration;
  EV.details = {scrollA: 1.0, scrollB: 2.4, backA: 2.9, backB: 3.6, color: 4.2, add: det - .6};
  const ast = BY.appAssistant.duration;
  EV.assistant = {typeA: .7, typeB: 2.4, send: 2.75, ask: 2.8, typing1: 3.1, answer: 4.3, cards: 5.0, type2A: 6.1, type2B: 6.8, send2: 7.05, pick: 7.1, typing2: 7.35, added: 8.2, open: ast - .5};
  EV.cart = {courier: 1.8, checkout: 3.9, done: 4.15};
  const s = id => BY[id].start;
  TAPS = [
    {t: s('botPick') - .5, target: 'kb-1'},
    {t: absTg(rel('botCart', .7)), target: 'tg-cart-fly'},
    {t: absTg(EV.tg.cartSend), target: 'tg-send'},
    {t: s('appCatalog') + EV.catalog.filter - .15, target: 'chip-travel'},
    {t: s('appCatalog') + EV.catalog.tap, target: 'card-bugaboo-butterfly-2'},
    {t: s('appDetails') + EV.details.color - .15, target: 'color-' + (D.byId['bugaboo-butterfly-2'].colors.length - 1)},
    {t: s('appDetails') + EV.details.add, target: 'details-add'},
    {t: s('appAssistant') + EV.assistant.send, target: 'assistant-send'},
    {t: s('appAssistant') + EV.assistant.send2, target: 'assistant-send'},
    {t: s('appAssistant') + EV.assistant.open, target: 'open-cart'},
    {t: s('appCart') + EV.cart.courier - .15, target: 'delivery-courier_brest'},
    {t: s('appCart') + EV.cart.checkout, target: 'checkout'},
  ];
  GLOWS = [
    {t: absTg(EV.tg.cartMsg + .5), d: 1.8, target: 'tg-cart-msg'},
    {t: s('appAssistant') + EV.assistant.added + .35, d: 1.4, target: 'assistant-added'},
    {t: s('appCart') + EV.cart.courier + .2, d: 1.5, target: 'cart-total'},
  ];
  return {total: t, taps: TAPS.map(x => x.t)};
}

function background(T) {
  const blobs = [
    ['#F3C9A8', .55, 760, 160 + 60 * Math.sin(T * .25), 220 + 50 * Math.cos(T * .2)],
    ['#C9DAD4', .75, 820, 640 + 80 * Math.cos(T * .18), 1300 + 70 * Math.sin(T * .22)],
    ['#E3EDE9', .9, 620, -120 + 60 * Math.sin(T * .3 + 1), 900 + 80 * Math.cos(T * .27)],
  ];
  document.getElementById('bg').innerHTML = blobs.map(([c, o, size, x, y]) => `<div class="blob" style="background:${c};opacity:${o};width:${size}px;height:${size}px;left:${x - size / 2 + 300}px;top:${y - size / 2}px"></div>`).join('');
}
function captionHtml(sc, style) {
  const tag = TAGS[sc.id] === 'telegram' ? `${ICONS.telegram('#2AABEE')}Telegram-бот` : `${ICONS.phone('#23574F')}Приложение`;
  return `<div class="cap" style="${style}"><div class="tag">${tag}</div><div class="title">${sc.title}</div><div class="subtitle">${sc.subtitle}</div></div>`;
}
function captions(T, i) {
  const sc = SCENES[i];
  const lt = T - sc.start;
  const parts = [];
  if (TAGS[sc.id]) {
    const p = easeOut(range(lt, .12, .62));
    parts.push(captionHtml(sc, `opacity:${p};transform:translateY(${(1 - p) * 40}px)`));
  }
  const prev = SCENES[i - 1];
  if (prev && TAGS[prev.id] && lt < .35) {
    const p = easeOut(range(lt, 0, .35));
    parts.push(captionHtml(prev, `opacity:${1 - p};transform:translateY(${-p * 30}px)`));
  }
  document.getElementById('captions').innerHTML = parts.join('');
}
function introOverlay(lt, out) {
  const logoP = backOut(range(lt, .25, .95));
  const titleP = easeOut(range(lt, .8, 1.4));
  const subP = easeOut(range(lt, 1.2, 1.8));
  const pillsP = easeOut(range(lt, 1.8, 2.5));
  const o = 1 - easeInOut(out);
  return `<div style="position:absolute;inset:0;opacity:${o};transform:translateY(${-easeInOut(out) * 240}px)">
    <div style="position:absolute;left:0;right:0;top:470px;display:flex;justify-content:center"><div class="logoTile" style="width:260px;height:260px;transform:scale(${logoP}) rotate(${(1 - clamp(logoP)) * -12}deg)">${pram('#fff', 200, true)}</div></div>
    <div style="position:absolute;left:0;right:0;top:810px">
      <div class="bigTitle" style="opacity:${titleP};transform:translateY(${(1 - titleP) * 40}px)">Колясочная</div>
      <div class="bigSub" style="opacity:${subP};transform:translateY(${(1 - subP) * 30}px)">Подбор коляски с ИИ-консультантом</div>
      <div class="pills" style="opacity:${pillsP};transform:translateY(${(1 - pillsP) * 30}px)"><div class="pill">${ICONS.telegram('#2AABEE')}${D.botHandle ? '@' + D.botHandle.replace(/^@/, '') : 'Telegram-бот'}</div><div class="pill">${ICONS.phone('#23574F')}iOS и Android</div></div>
    </div>
  </div>`;
}
function outroOverlay(lt) {
  const logoP = backOut(range(lt, .5, 1.2));
  const titleP = easeOut(range(lt, 1.0, 1.6));
  const subP = easeOut(range(lt, 1.4, 2.0));
  const pillsP = easeOut(range(lt, 1.9, 2.6));
  const footP = easeOut(range(lt, 2.4, 3.0));
  return `<div style="position:absolute;inset:0">
    <div style="position:absolute;left:0;right:0;top:420px;display:flex;justify-content:center"><div class="logoTile" style="width:240px;height:240px;transform:scale(${logoP})">${pram('#fff', 184, true)}</div></div>
    <div style="position:absolute;left:0;right:0;top:740px">
      <div class="bigTitle" style="opacity:${titleP};transform:translateY(${(1 - titleP) * 40}px)">Колясочная</div>
      <div class="bigSub" style="opacity:${subP};transform:translateY(${(1 - subP) * 30}px)">Подберём коляску за минуту</div>
      <div class="pills" style="flex-direction:column;align-items:center;opacity:${pillsP};transform:translateY(${(1 - pillsP) * 30}px)"><div class="pill">${ICONS.telegram('#2AABEE')}${D.botHandle ? 'Telegram: @' + D.botHandle.replace(/^@/, '') : 'Бот в Telegram'}</div><div class="pill">${ICONS.phone('#23574F')}Приложение для iOS и Android</div></div>
    </div>
    <div class="foot" style="opacity:${footP}">${D.shop.city} · ${D.shop.working_hours}</div>
  </div>`;
}

function setPhone(transform, opacity = 1) {
  const phone = document.getElementById('phone');
  phone.style.transform = `scale(${PHONE_SCALE}) ${transform}`;
  phone.style.opacity = opacity;
  phone.style.left = `${(1080 - 406 * PHONE_SCALE) / 2}px`;
}
function finishScreen() {
  const screen = document.getElementById('screen');
  screen.querySelectorAll('.grow').forEach(el => {
    el.style.height = 'auto';
    const h = el.scrollHeight;
    el.style.height = `${h * parseFloat(el.dataset.p)}px`;
  });
}
function drawTaps(T, layer) {
  const screen = document.getElementById('screen');
  const sr = screen.getBoundingClientRect();
  const scale = sr.width / 390;
  const out = [];
  for (const tp of TAPS) {
    if (T < tp.t - .55 || T > tp.t + .6) continue;
    const el = layer.querySelector(`[data-tap="${tp.target}"]`);
    if (!el) continue;
    const r = el.getBoundingClientRect();
    if (r.width === 0) continue;
    const x = (r.left + r.width / 2 - sr.left) / scale;
    const y = (r.top + r.height / 2 - sr.top) / scale;
    const approach = easeOut(range(T, tp.t - .55, tp.t - .1));
    const press = T >= tp.t - .05 && T <= tp.t + .12 ? .82 : 1;
    const fadeOut = 1 - range(T, tp.t + .25, tp.t + .6);
    const fx = x + (1 - approach) * 40;
    const fy = y + (1 - approach) * 70;
    out.push(`<div class="finger" style="left:${fx}px;top:${fy}px;opacity:${approach * fadeOut};transform:scale(${press * lerp(1.25, 1, approach)})"></div>`);
    if (T >= tp.t) {
      const rp = range(T, tp.t, tp.t + .5);
      const size = lerp(30, 110, easeOut(rp));
      out.push(`<div class="ripple" style="left:${x - size / 2}px;top:${y - size / 2}px;width:${size}px;height:${size}px;opacity:${1 - rp}"></div>`);
    }
  }
  return out.join('');
}

function renderAt(T) {
  NOW = T;
  let i = SCENES.findIndex(s => T < s.start + s.duration);
  if (i < 0) i = SCENES.length - 1;
  const sc = SCENES[i];
  const lt = T - sc.start;
  background(T);
  captions(T, i);
  const overlay = document.getElementById('overlay');
  const screen = document.getElementById('screen');
  const inner = document.getElementById('phoneInner');
  inner.style.transform = '';
  const [type, td] = TRANSITIONS[sc.id] || ['none', 0];
  const p = td ? clamp(lt / td) : 1;
  const prev = SCENES[i - 1];
  const prevEnd = prev ? prev.start + prev.duration - 1e-3 : 0;
  let layers = '';

  if (sc.id === 'intro') {
    setPhone('translateY(1200px)', 0);
    overlay.innerHTML = introOverlay(lt, 0);
    screen.innerHTML = '';
    return;
  }
  if (sc.id === 'outro') {
    const sp = easeInOut(p);
    setPhone(`translateY(${sp * 1100}px) rotate(${sp * 6}deg)`, 1 - sp * .6);
    layers = `<div class="layer">${screenFor('appCart', prevEnd)}</div>`;
    screen.innerHTML = layers + '<div class="homeBar"></div>';
    finishScreen();
    overlay.innerHTML = outroOverlay(lt);
    return;
  }
  overlay.innerHTML = sc.id === 'botStart' && lt < td ? introOverlay(prev.duration, easeInOut(p)) : '';

  if (type === 'rise' && p < 1) {
    const rp = easeOut(p);
    setPhone(`translateY(${(1 - rp) * 1150}px) rotate(${(1 - rp) * -5}deg)`, 1);
  } else {
    setPhone('', 1);
  }

  const current = screenFor(sc.id, T);
  if (p < 1 && type === 'push') {
    const pp = easeInOut(p);
    layers = `<div class="layer" style="transform:translateX(${-pp * 30}%);filter:brightness(${1 - pp * .12})">${screenFor(prev.id, prevEnd)}</div><div class="layer" data-current="1" style="transform:translateX(${(1 - pp) * 100}%);box-shadow:-10px 0 30px rgba(0,0,0,.12)">${current}</div>`;
  } else if (p < 1 && type === 'fade') {
    const pp = easeInOut(p);
    layers = `<div class="layer">${screenFor(prev.id, prevEnd)}</div><div class="layer" data-current="1" style="opacity:${pp};transform:scale(${lerp(.98, 1, pp)})">${current}</div>`;
  } else if (p < 1 && type === 'flip') {
    const pp = easeInOut(p);
    const isFirstHalf = pp < .5;
    const angle = isFirstHalf ? pp * 180 : (pp - 1) * 180;
    const s = 1 - Math.sin(pp * Math.PI) * .12;
    inner.style.transform = `rotateY(${angle}deg) scale(${s})`;
    layers = `<div class="layer" data-current="1">${isFirstHalf ? screenFor(prev.id, prevEnd) : current}</div>`;
  } else {
    layers = `<div class="layer" data-current="1">${current}</div>`;
  }
  screen.innerHTML = layers + '<div class="homeBar"></div>';
  finishScreen();
  const currentLayer = screen.querySelector('[data-current="1"]');
  if (currentLayer && p >= 1) currentLayer.insertAdjacentHTML('beforeend', drawTaps(T, currentLayer));
}
window.setup = setup;
window.renderAt = renderAt;
</script>
</body>
</html>
